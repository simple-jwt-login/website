StylesPath = styles
MinAlertLevel = warning

Packages = Google, write-good, MDX

Vocab = SimpleJWT

# HTML: skip quoted content we must not reword (user reviews, personal note)
# and data tables - add className="vale-ignore" to the element in the JSX.
IgnoredClasses = vale-ignore

# Markdown, mdx
[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good

# Comments in GO, JavaScript, TypeScript, PHP sources
[*.{go,js,ts,php}]
BasedOnStyles = Vale, Google, write-good

# OpenAPI sources - lint only human-readable fields (description, summary, title).
# See styles/config/views/OpenAPI.yml.
[openapi/**/*.yaml]
BasedOnStyles = Vale, Google, write-good
View = OpenAPI

# Website pages - src/pages/*.jsx are linted from the rendered HTML in build/
# (Vale cannot read JSX text). Run `yarn build` first; see scripts/vale.sh.
[build/**/*.html]
BasedOnStyles = Vale, Google, write-good
# Marketing pages speak as the project (we/us/our).
Google.We = NO

# Rule overrides (apply to all files)
[*]
# Flags every "is/are/be" - not practical for technical docs.
write-good.E-Prime = NO
# Duplicates Google.Passive, which already reports the same sentences.
write-good.Passive = NO
# Title Case headings are the site convention and mirror plugin UI labels.
Google.Headings = NO
# Flags plugin terminology ("disabled", "admin", "Email") that mirrors UI labels.
Google.WordListCase = NO
# Flags endpoint/setting names ("validate", "expiration", "obtain").
write-good.TooWordy = NO
