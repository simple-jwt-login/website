type: object
properties:
  email:
    type: string
    example: john@doe.com
    description: User email address. Required when `username` is not provided.
  username:
    type: string
    example: myuser
    description: WordPress login username. Required when `email` is not provided.
  password:
    type: string
    description: User plaintext password. Required when `password_hash` is not provided.
  password_hash:
    type: string
    description: |
      Hashed password as stored in the WordPress database. Requires "Allow login with
      password hash" to be enabled in the plugin settings. Required when `password`
      is not provided.
  AUTH_KEY:
    type: string
    example: "MY_SUPER_SECRET_AUTH_KEY"
    description: Required when "Authentication Requires Auth Code" is enabled.
  payload:
    nullable: true
    oneOf:
      - type: string
        example: '{"department":"engineering","region":"eu"}'
      - type: object
        example: {"department": "engineering", "region": "eu"}
    description: |
      Optional extra claims merged into the JWT payload. Accepted either as a
      JSON-encoded string (form-encoded/query-string requests) or as a native
      JSON object (JSON body requests).
      Reserved identity claims configured in the plugin's payload settings (e.g.
      `email`, `id`, `username`, `site`, `iss`, `exp`, `iat`) and the custom
      "JWT payload key" claim, if configured, are always stripped from this
      value and set from the authenticated user instead - they cannot be
      overridden by the caller.
