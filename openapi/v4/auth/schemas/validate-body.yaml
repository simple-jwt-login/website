type: object
properties:
  JWT:
    type: string
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    description: |
      The JWT to validate. Optional when the JWT is sent in the `Authorization` header,
      cookie, or session instead.
  AUTH_KEY:
    type: string
    nullable: true
    example: MY_SUPER_SECRET_AUTH_CODE
    description: |
      Required when "Validate Token Requires Auth Code" is enabled. The parameter
      name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
      settings.
