tags:
  - authenticate_user
summary: Authenticate and obtain a JWT
description: |
  Validates the user's WordPress credentials and returns a signed JWT. An optional
  refresh token is also returned when the refresh-token feature is enabled in the
  plugin settings.

  **Credentials**
  Supply one of `email`, `username` or `login` (username or email). When several are
  sent, `username` wins over `email`, and `email` wins over `login`. Plus one of:
  - `password` - plaintext password, verified with `wp_authenticate()`, so the
    `authenticate` / `wp_authenticate_user` filters of login protection plugins
    (lockouts, blocked users) apply. Application passwords are not accepted.
  - `password_hash` - the hashed password as stored in the WordPress database
    (must be enabled in the plugin settings)

  Every failed attempt (unknown user, wrong password or hash) fires
  `wp_login_failed`, so brute-force plugins count it.

  **Requirements**
  - Authentication must be enabled in the plugin settings.
  - If "Authentication Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

  **Custom payload claims**
  Optionally supply `payload` as a JSON-encoded object to add extra claims to the
  issued JWT. Reserved identity claims are always derived from the authenticated
  user and cannot be overridden this way.

  **Two-Factor Authentication**
  When the authenticated user has Two-Factor Authentication enabled and the 2FA
  integration is active, the endpoint returns HTTP 200 with a challenge response
  instead of a regular JWT. The `two_factor_required` field is `true` and `jwt`
  contains a short-lived interim token. Submit that interim token together with the
  2FA code to `POST /auth/2fa` to obtain the final JWT.
operationId: getJWT
requestBody:
  description: User credentials.
  content:
    application/json:
      schema:
        $ref: ../schemas/auth-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/auth-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/auth-body.yaml
  required: true
responses:
  '200':
    description: |
      Authentication successful. Returns a signed JWT and an optional refresh token.

      **Two-Factor challenge**: when the user has 2FA enabled, this response is
      returned instead of a regular JWT. `two_factor_required` is `true` and
      `jwt` contains a short-lived interim token. Submit it with the 2FA code
      to `POST /auth/2fa` to obtain the final JWT.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Action status.
              example: true
            data:
              type: object
              properties:
                jwt:
                  type: string
                  description: |
                    Signed JWT for use in subsequent requests, or a short-lived
                    interim JWT when `two_factor_required` is `true`.
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                refresh_token:
                  type: string
                  nullable: true
                  description: |
                    Opaque refresh token for obtaining new JWTs without re-authenticating.
                    Only present when the refresh-token feature is enabled and 2FA is
                    not required.
                  example: a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012
                two_factor_required:
                  type: boolean
                  nullable: true
                  description: |
                    Present and `true` only when Two-Factor Authentication is required.
                    When set, `jwt` is an interim token; complete authentication via
                    `POST /auth/2fa`.
                  example: true
                provider:
                  type: string
                  nullable: true
                  description: |
                    Fully qualified class name of the user's primary 2FA provider.
                    Only present when `two_factor_required` is `true`.
                  example: Two_Factor_Totp
        examples:
          jwt:
            summary: Regular login (refresh tokens enabled)
            value:
              success: true
              data:
                jwt: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjMyOTk0MDAsImVtYWlsIjoiam9obkBkb2UuY29tIiwiaWQiOjEsInVzZXJuYW1lIjoibXl1c2VyIn0.signature
                refresh_token: a1b2c3d4e5f678901234567890123456789012345678901234567890123456789012
          twoFactorChallenge:
            summary: User has Two-Factor enabled
            value:
              success: true
              data:
                jwt: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0ZmFfcGVuZGluZyI6MX0.signature
                two_factor_required: true
                provider: Two_Factor_Totp
  '400':
    description: |
      The JWT could not be signed (JWT library error, for example, OpenSSL signing failure
      `error_code` 16, or a bad private key / algorithm `error_code` 1, 7, 17).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: OpenSSL unable to sign data
            error_code: 16
  '401':
    description: |
      Unauthorized. One of:
      - The user does not exist, or the password / password hash is wrong (`error_code` 48).
        When "Password is base64 encoded" is on, a value that is not valid base64 is also
        treated as wrong credentials.
      - The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Wrong user credentials.
            error_code: 48
  '403':
    description: |
      Forbidden. One of:
      - Authentication is disabled in the plugin settings (`error_code` 45).
      - The client IP address is not on the allow-list configured in the plugin
        settings (`error_code` 41).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Authentication is not enabled.
            error_code: 45
  '422':
    description: |
      Unprocessable entity. One of:
      - The `email`, `username`, or `login` field is missing (`error_code` 46).
      - The `password` or `password_hash` field is missing (`error_code` 47).
      - The `password_hash` field was provided but "Allow login with password hash"
        is not enabled in the plugin settings (`error_code` 113).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: 'The email, username, or login parameter is missing from the request.'
            error_code: 46
  '500':
    description: |
      Internal server error. One of:
      - The refresh token could not be saved in the database (`error_code` 131).
      - The 2FA nonce for the challenge could not be created (`error_code` 133).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Unable to save the refresh token.
            error_code: 131
