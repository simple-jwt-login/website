tags:
  - authenticate_user
summary: Refresh an expired JWT
operationId: refreshJWT
description: |
  Exchanges a valid refresh token for a new JWT (and a new refresh token). The
  original refresh token is invalidated after use.

  **Requirements**
  - The refresh-token feature must be enabled in the plugin settings.
  - The refresh token must exist in the database and not have exceeded the maximum
    token age configured in the plugin settings.
  - If "Authentication Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
requestBody:
  description: Refresh token obtained from a prior `/auth` response.
  content:
    application/json:
      schema:
        $ref: '../schemas/auth-refresh-body.yaml'
    multipart/form-data:
      schema:
        $ref: '../schemas/auth-refresh-body.yaml'
    application/x-www-form-urlencoded:
      schema:
        $ref: '../schemas/auth-refresh-body.yaml'
  required: true
responses:
  '200':
    description: JWT refreshed successfully. Returns a new JWT and a new refresh token.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Action status.
              example: true
            data:
              type: object
              properties:
                jwt:
                  type: string
                  description: Newly issued JWT.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                refresh_token:
                  type: string
                  description: New refresh token replacing the one that was consumed.
                  example: "f6e7g8h9i0j123456789012345678901234567890123456789012345678901234567"
  '401':
    description: |
      Unauthorized. One of:
      - The refresh token was not found in the database (expired, already rotated,
        or never issued) (`error_code` 51).
      - A JWT was supplied alongside the refresh token but has been revoked -
        revoked JWTs cannot be used to obtain new tokens (`error_code` 55).
      - The WordPress user linked to the refresh token no longer exists
        (`error_code` 55).
      - The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Invalid refresh token."
            error_code: 51
  '403':
    description: |
      Forbidden. One of:
      - The refresh-token feature is disabled in the plugin settings (`error_code` 81).
      - Authentication is disabled in the plugin settings (`error_code` 45).
      - The client IP address is not on the allow-list (`error_code` 41).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Refresh Token endpoint is not enabled."
            error_code: 81
  '422':
    description: |
      Unprocessable entity. One of:
      - The `refresh_token` field is absent from the request (`error_code` 51).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Refresh token is missing."
            error_code: 51
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "An unexpected error occurred."
            error_code: 22
