tags:
  - authenticate_user
summary: Validate a JWT and retrieve user details
operationId: validateJWT
security:
  - BearerAuth: []
  - QueryJWT: []
description: |
  Verifies the JWT signature, checks expiry and revocation status, and returns the
  decoded token information together with the matching WordPress user profile and roles.

  **JWT delivery**
  The JWT can be passed via:
  - `JWT` query parameter
  - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)
  - Cookie or session (when enabled in plugin General Settings)

  **Requirements**
  - Token validation must be enabled in the plugin settings.
  - If "Authentication Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
parameters:
  - name: JWT
    in: query
    description: "The JWT to validate. Alternative to the `Authorization: Bearer` header."
    required: false
    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
    schema:
      type: string
  - name: AUTH_KEY
    in: query
    example: "MY_SUPER_SECRET_AUTH_KEY"
    description: |
      Required when "Authentication Requires Auth Code" is enabled. The parameter
      name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
      settings.
    schema:
      type: string
responses:
  '200':
    description: JWT is valid. Returns the decoded token and the associated WordPress user.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    ID:
                      type: string
                      example: "1"
                    user_login:
                      type: string
                      example: "myuser"
                    user_nicename:
                      type: string
                      example: "myuser"
                    user_email:
                      type: string
                      example: "myuser@simplejwtlogin.com"
                    user_url:
                      type: string
                      example: "https://simplejwtlogin.com/myuser"
                    user_registered:
                      type: string
                      example: "2021-01-01 23:31:50"
                    user_activation_key:
                      type: string
                      example: ""
                    user_status:
                      type: string
                      example: "0"
                    display_name:
                      type: string
                      example: "myuser"
                roles:
                  type: array
                  items:
                    type: string
                    example: "administrator"
                jwt:
                  type: object
                  properties:
                    token:
                      type: string
                      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                    header:
                      type: object
                      properties:
                        typ:
                          type: string
                          example: "JWT"
                        alg:
                          type: string
                          example: "HS256"
                    payload:
                      type: object
                      properties:
                        iat:
                          type: number
                          description: Issued-at timestamp. Always present.
                          example: 1516239022
                        exp:
                          type: number
                          nullable: true
                          description: Expiry timestamp. Present only when the `exp` payload parameter is enabled in plugin settings.
                          example: 1516242622
                        email:
                          type: string
                          nullable: true
                          description: User email. Present only when enabled in plugin settings.
                          example: "myuser@simplejwtlogin.com"
                        id:
                          type: number
                          nullable: true
                          description: WordPress user ID. Present only when enabled in plugin settings.
                          example: 1
                        site:
                          type: string
                          nullable: true
                          description: Site URL. Present only when enabled in plugin settings.
                          example: "https://simplejwtlogin.com"
                        username:
                          type: string
                          nullable: true
                          description: WordPress login username. Present only when enabled in plugin settings.
                          example: "myuser"
                        iss:
                          type: string
                          nullable: true
                          description: Issuer claim. Present only when enabled in plugin settings.
                          example: "https://simplejwtlogin.com"
                    expire_in:
                      type: integer
                      nullable: true
                      description: |
                        Seconds until the JWT expires (`exp - now`). Only present
                        when the JWT payload contains an `exp` claim.
                      example: 3600
  '400':
    description: |
      Bad request. The JWT has a structural encoding error (wrong number of
      segments, invalid base64 encoding of header, claims, or signature).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Wrong number of segments."
            error_code: 2
  '401':
    description: |
      Unauthorized. One of:
      - The JWT signature verification failed or algorithm is unsupported
        (`error_code` 6-11).
      - The JWT has `nbf`/`iat` violations or is expired (`error_code` 12-14).
      - The JWT has been revoked (`error_code` 55).
      - The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "JWT has expired."
            error_code: 14
  '403':
    description: |
      Forbidden. JWT validation is disabled in the plugin settings (`error_code` 82).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Validate token is not enabled."
            error_code: 82
  '422':
    description: |
      Unprocessable entity. One of:
      - The JWT is completely absent from the request (`error_code` 53).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "JWT is missing."
            error_code: 53
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "An unexpected error occurred."
            error_code: 22
