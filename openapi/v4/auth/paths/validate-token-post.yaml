tags:
  - authenticate_user
summary: Validate a JWT (POST)
operationId: validateJWTPost
security:
  - BearerAuth: []
description: |
  Identical to `GET /auth/validate` but accepts the JWT in the request body instead of
  as a query parameter. Use this variant when the JWT is too long for a URL, or when
  sending it in the body is preferred for security reasons.

  **JWT delivery**
  The JWT can be passed via:
  - `JWT` field in the request body
  - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)
requestBody:
  description: JWT to validate.
  content:
    application/json:
      schema:
        $ref: '../schemas/validate-body.yaml'
    multipart/form-data:
      schema:
        $ref: '../schemas/validate-body.yaml'
    application/x-www-form-urlencoded:
      schema:
        $ref: '../schemas/validate-body.yaml'
  required: true
responses:
  '200':
    description: JWT is valid. Returns the decoded token and the associated WordPress user.
    content:
      application/json:
        schema:
          $ref: '../schemas/validate-response.yaml'
  '400':
    description: |
      Bad request. The JWT has a structural encoding error (wrong number of
      segments, invalid base64 encoding of header, claims, or signature).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
  '401':
    description: |
      Unauthorized. The JWT signature verification failed, is expired, or has
      been revoked. The provided auth code is wrong.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
  '403':
    description: |
      Forbidden. JWT validation is disabled in the plugin settings (`error_code` 82).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
  '422':
    description: |
      Unprocessable entity. The `JWT` field is absent from the request body
      (`error_code` 53), or the auth code is required but not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
