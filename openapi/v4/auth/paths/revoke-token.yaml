tags:
  - authenticate_user
summary: Revoke a JWT
description: |
  Marks the provided JWT as revoked in the database. Once revoked, the token is
  rejected by all plugin endpoints that check for revocation (autologin, validate,
  refresh, etc.).

  **JWT delivery**
  The JWT to revoke can be passed via:
  - `JWT` field in the request body
  - `Authorization: Bearer <token>` header (when enabled in plugin General Settings)

  **Requirements**
  - Authentication and token revocation must be enabled in the plugin settings.
  - The calling IP must pass the authentication IP allow-list.
  - The JWT must be valid: signed with the configured key and not expired (an expired
    JWT answers `400`, `error_code` 14).
  - If "Revoke Token Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

  **Side effects**
  All refresh tokens of the user are deleted too. The response can be changed with the
  `simple_jwt_login_response_revoke_token` filter.
operationId: revokeJWT
security:
  - BearerAuth: []
requestBody:
  description: 'The JWT to revoke, plus optional auth code.'
  content:
    application/json:
      schema:
        $ref: ../schemas/auth-revoke-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/auth-revoke-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/auth-revoke-body.yaml
  required: true
responses:
  '200':
    description: Token revoked successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Action status.
              example: true
            message:
              type: string
              description: Confirmation message.
              example: Token was revoked.
            data:
              type: object
              properties:
                jwt:
                  type: array
                  description: Array containing the revoked JWT string.
                  items:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
  '400':
    description: |
      The JWT could not be decoded or validated (all JWT library errors return 400):
      - Malformed token: wrong number of segments, bad header/claims/signature encoding (`error_code` 2-5).
      - Algorithm missing, unsupported or not allowed, bad `kid` (`error_code` 6-10).
      - Signature verification failed (`error_code` 11).
      - Token not yet valid (`nbf`/`iat`) or expired (`error_code` 12-14).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        examples:
          expired:
            value:
              success: false
              data:
                message: Expired token
                error_code: 14
          badSignature:
            value:
              success: false
              data:
                message: Signature verification failed
                error_code: 11
  '401':
    description: |
      Unauthorized. One of:
      - The JWT was already revoked (`error_code` 55).
      - The `aud` claim does not match the expected audience (`error_code` 130).
      - The provided auth code is wrong (`error_code` 27).
      - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
      - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Token was already revoked.
            error_code: 55
  '403':
    description: |
      Forbidden. One of:
      - Authentication is disabled in the plugin settings (`error_code` 45).
      - Token revocation is disabled in the plugin settings (`error_code` 83).
      - The client IP address is not on the authentication allow-list (`error_code` 41).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Revoke Token endpoint is not enabled.
            error_code: 83
  '404':
    description: The WordPress user identified by the JWT payload could not be found (`error_code` 24).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: User not found.
            error_code: 24
  '422':
    description: |
      Unprocessable entity. One of:
      - The JWT is absent from the request (`error_code` 53).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: The `jwt` parameter is missing.
            error_code: 53
  '500':
    description: Internal server error (any other unexpected error).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
