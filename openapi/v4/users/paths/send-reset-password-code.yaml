tags:
  - reset_password
operationId: sendResetPasswordCode
summary: Send reset password email
description: |
  Sends a one-time reset code to the user's registered email address. The code must
  then be supplied to `PUT /user/reset_password` together with the new password.

  **Requirements**
  - Password reset must be enabled in the plugin settings.
  - If "Reset Password Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
  - The email address must belong to an existing WordPress user.

  **Flow**
  1. Call `POST /user/reset_password` with `email` (and `AUTH_KEY` if required).
  2. The user receives an email containing a one-time `code`.
  3. Call `PUT /user/reset_password` with `email`, `code`, and `new_password`.
requestBody:
  description: Email address of the account whose password should be reset.
  content:
    application/json:
      schema:
        $ref: '../schemas/reset-password-body.yaml'
    multipart/form-data:
      schema:
        $ref: '../schemas/reset-password-body.yaml'
    application/x-www-form-urlencoded:
      schema:
        $ref: '../schemas/reset-password-body.yaml'
  required: true
responses:
  '200':
    description: Reset password email sent successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                message:
                  type: string
                  example: Reset password email has been sent.
  '401':
    description: |
      Unauthorized. The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Invalid Auth Code ( AUTH_KEY ) provided."
            error_code: 27
  '403':
    description: |
      Forbidden. Password reset is disabled in the plugin settings (`error_code` 56).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Reset Password is not allowed."
            error_code: 56
  '404':
    description: No WordPress user with the provided email address was found.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Wrong user."
            error_code: 64
  '422':
    description: |
      Unprocessable entity. One of:
      - The `email` field is missing (`error_code` 63).
      - The email address format is invalid (`error_code` 96).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Missing email parameter."
            error_code: 63
  '500':
    description: Internal server error (e.g. email sending failure).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "An unexpected error occurred."
            error_code: 22
