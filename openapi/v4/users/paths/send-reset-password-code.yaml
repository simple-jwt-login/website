tags:
  - reset_password
operationId: sendResetPasswordCode
summary: Send reset password email
description: |
  Sends a one-time reset code to the user's registered email address. The code must
  then be supplied to `PUT /user/reset_password` together with the new password.

  **Requirements**
  - Password reset must be enabled in the plugin settings.
  - If "Reset Password Requires Auth Code" is enabled, `AUTH_KEY` must be provided.

  An email that does not belong to a WordPress user gets the same `200` answer as one
  that does (nothing is sent), so the endpoint can not be used to find which emails
  have an account. Exception: the `simple_jwt_login_response_send_reset_password`
  filter and the reset password webhooks run only for real users. When they change
  the response or add a delay, callers can tell which emails exist.

  **Flow**
  1. Call `POST /user/reset_password` with `email` (and `AUTH_KEY` if required).
  2. The user receives an email containing a one-time `code`.
  3. Call `PUT /user/reset_password` with `email`, `code`, and `new_password`.
requestBody:
  description: Email address of the account whose password should be reset.
  content:
    application/json:
      schema:
        $ref: ../schemas/reset-password-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/reset-password-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/reset-password-body.yaml
  required: true
responses:
  '200':
    description: |
      Request accepted (also for emails without an account). The message depends on the
      "Reset password flow" setting.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                message:
                  type: string
                  example: Reset password email has been sent.
        examples:
          emailSent:
            summary: Flow "send default WordPress email" or "send custom email"
            value:
              success: true
              data:
                message: Reset password email has been sent.
          codeSaved:
            summary: Flow "just save the code in the database"
            value:
              success: true
              data:
                message: The Code has been saved into the database.
  '401':
    description: |
      Unauthorized. The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Invalid Auth Code ( AUTH_KEY ) provided.
            error_code: 27
  '403':
    description: |
      Forbidden. Password reset is disabled in the plugin settings (`error_code` 56).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Reset Password is not allowed.
            error_code: 56
  '422':
    description: |
      Unprocessable entity. One of:
      - The `email` field is missing (`error_code` 63).
      - The email address format is invalid (`error_code` 96).
      - The auth code is required but was not provided (`error_code` 94).
      - The configured reset password flow is invalid (`error_code` 65).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        examples:
          missingEmail:
            value:
              success: false
              data:
                message: Missing email parameter.
                error_code: 63
          invalidEmail:
            value:
              success: false
              data:
                message: Invalid email parameter.
                error_code: 96
  '500':
    description: |
      Internal server error, for example, WordPress could not send the reset email. The message
      is the one of the underlying error.
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
