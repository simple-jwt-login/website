tags:
  - delete_user
summary: Delete a WordPress user
description: |
  Permanently deletes the WordPress user identified by the JWT payload. The JWT is
  decoded to extract the user identifier (email, ID, or login, depending on plugin
  settings), the user is looked up, and `wp_delete_user()` is called.

  **Requirements**
  - User deletion must be enabled in the plugin settings.
  - The JWT must be valid, not expired, and not revoked.
  - If "Delete Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
  - The calling IP must pass any IP allow-list configured in the plugin settings.
operationId: deleteUser
parameters:
  - name: JWT
    in: query
    description: |
      A valid signed JWT identifying the WordPress user to delete. Can also be sent in the
      `Authorization` header, cookie, or session (when enabled in General Settings).
    required: false
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    schema:
      type: string
  - name: AUTH_KEY
    in: query
    example: MY_SUPER_SECRET_AUTH_CODE
    description: |
      Required when "Delete User Requires Auth Code" is enabled in the plugin settings.
      The parameter name defaults to `AUTH_KEY` but is configurable in the plugin's
      Auth Codes settings.
    schema:
      type: string
responses:
  '200':
    description: |
      User deleted. Their refresh tokens and revoked-token records are removed too.
      The body can be changed with the `simple_jwt_login_response_delete_user` filter.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                message:
                  type: string
                  description: Confirmation message.
                  example: User was successfully deleted.
  '400':
    description: |
      The JWT could not be decoded or validated (all JWT library errors return 400):
      malformed token (`error_code` 2-5), algorithm/`kid` problems (`error_code` 6-10),
      bad signature (`error_code` 11), not yet valid or expired (`error_code` 12-14).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Expired token
            error_code: 14
  '401':
    description: |
      Unauthorized. One of:
      - The JWT has been revoked, or was issued before the user's last password change (`error_code` 55).
      - The `aud` claim does not match the expected audience (`error_code` 130).
      - The provided auth code is wrong (`error_code` 27).
      - The JWT is a 2FA interim token: finish the `/auth/2fa` step first (`error_code` 110).
      - The JWT does not contain the claim configured as "JWT login by" parameter (`error_code` 29, 30).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: This JWT is invalid.
            error_code: 55
  '403':
    description: |
      Forbidden. One of:
      - User deletion is disabled in the plugin settings (`error_code` 39).
      - The client IP address is not on the allow-list (`error_code` 41).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Delete is not enabled.
            error_code: 39
  '404':
    description: The WordPress user identified by the JWT payload could not be found (`error_code` 24).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: User not found.
            error_code: 24
  '422':
    description: |
      Unprocessable entity. One of:
      - The JWT is absent from the request (`error_code` 42).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: The `jwt` parameter is missing.
            error_code: 42
  '500':
    description: Internal server error (any other unexpected error).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
