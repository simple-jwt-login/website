tags:
  - reset_password
operationId: changeUserPassword
summary: Change user password
description: |
  Sets a new password for the user. Two authentication modes are supported:

  **Code-based (default)**
  Provide `email`, the one-time `code` received by email (from `POST /user/reset_password`),
  and `new_password`.

  **JWT-based (optional)**
  When "Allow Reset Password with JWT" is enabled in the plugin settings, provide a
  valid `JWT` and `new_password`. The `code` field is not required in this mode.
  Note: JWTs that were themselves issued via a reset-password flow cannot be reused
  to change a password again.

  **Requirements**
  - Password reset must be enabled in the plugin settings.
  - If "Reset Password Requires Auth Code" is enabled, `AUTH_KEY` must be provided.
requestBody:
  description: New password plus either a one-time code or a valid JWT for authentication.
  content:
    application/json:
      schema:
        $ref: '../schemas/change-password-body.yaml'
    multipart/form-data:
      schema:
        $ref: '../schemas/change-password-body.yaml'
    application/x-www-form-urlencoded:
      schema:
        $ref: '../schemas/change-password-body.yaml'
  required: true
responses:
  '200':
    description: Password changed successfully.
    content:
      application/json:
        schema:
          type: object
          required:
            - success
            - data
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: User password has been changed.
  '401':
    description: |
      Unauthorized. One of:
      - The JWT is invalid, expired, or does not match the provided email
        (`error_code` 93).
      - The provided auth code is wrong (`error_code` 27).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "This JWT can not change your password."
            error_code: 93
  '403':
    description: |
      Forbidden. Password reset is disabled in the plugin settings (`error_code` 56).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Reset Password is not allowed."
            error_code: 56
  '404':
    description: No WordPress user with the provided email address was found.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "User not found."
            error_code: 64
  '422':
    description: |
      Unprocessable entity. One of:
      - The `email` field is missing (`error_code` 59).
      - The `new_password` field is missing (`error_code` 61).
      - JWT-based reset is enabled but neither `code` nor a JWT was provided
        (`error_code` 53).
      - JWT-based reset is disabled and the `code` field is missing
        (`error_code` 60).
      - The email address format is invalid (`error_code` 95).
      - The one-time reset code is invalid or expired (`error_code` 62).
      - The auth code is required but was not provided (`error_code` 94).
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "Invalid code provided."
            error_code: 62
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          $ref: '../../schemas/error.yaml'
        example:
          success: false
          data:
            message: "An unexpected error occurred."
            error_code: 22
