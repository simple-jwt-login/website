type: object
required:
  - email
properties:
  email:
    type: string
    example: contact@simplejwtlogin.com
    description: Email address of the account to reset.
  AUTH_KEY:
    type: string
    nullable: true
    example: MY_SUPER_SECRET_AUTH_CODE
    description: |
      Required when "Reset Password Requires Auth Code" is enabled. The parameter
      name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
      settings.
