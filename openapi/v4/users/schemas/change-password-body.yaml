type: object
required:
  - email
  - new_password
properties:
  email:
    type: string
    example: contact@simplejwtlogin.com
    description: Email address of the account whose password to change.
  code:
    type: string
    nullable: true
    example: MY_SECRET_CODE_RECEIVED_BY_EMAIL
    description: |
      One-time reset code received by email (from `POST /user/reset_password`).
      Required in code-based reset flow; not required when `JWT` is provided and
      JWT-based reset is enabled.
  new_password:
    type: string
    example: NewSecurePassword123!
    description: |
      The new password to set for the account. Base64-encoded when "Password is base64
      encoded" is enabled in the authentication settings.
  JWT:
    type: string
    nullable: true
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    description: |
      Valid JWT for the user. Used only when "Allow Reset Password with JWT" is enabled
      and `code` is empty; the JWT user email must equal `email`. Can also be sent in the
      `Authorization` header, cookie, or session.
  AUTH_KEY:
    type: string
    nullable: true
    example: MY_SUPER_SECRET_AUTH_CODE
    description: |
      Required when "Reset Password Requires Auth Code" is enabled. The parameter
      name defaults to `AUTH_KEY` but is configurable in the plugin's Auth Codes
      settings.
