description: |
  WordPress core error: the request is not authenticated (no logged-in session with a
  valid `X-WP-Nonce`, and no valid JWT in the header or cookie). The plugin is not called.
content:
  application/json:
    schema:
      $ref: ../schemas/wp-rest-error.yaml
    example:
      code: rest_forbidden
      message: 'Sorry, you are not allowed to do that.'
      data:
        status: 401
