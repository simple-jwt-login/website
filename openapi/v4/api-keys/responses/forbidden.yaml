description: |
  Forbidden (`error_code` 84). One of:
  - The user is not logged in.
  - The user does not own this API key and is not an administrator.
  - A non-administrator tries to grant a permission they do not have.
content:
  application/json:
    schema:
      $ref: ../schemas/api-key-error.yaml
    example:
      code: simple_jwt_login_api_key_error
      message: You are not allowed to manage this API key.
      data:
        status: 403
        error_code: 84
