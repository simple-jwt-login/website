tags:
  - api_keys
  - internal
summary: List API keys
description: |
  Returns a paginated list of API keys, newest first. Administrators (`manage_options`)
  see the keys of every user (with `user_id`); other users see only their own keys.

  The full key value is never returned; only the first 8 characters are shown
  (followed by `****`).

  **Authentication**
  The WordPress user must be authenticated: a logged-in session (cookie plus the
  `X-WP-Nonce` header for REST calls), or a JWT in the header or cookie. Without it
  WordPress answers `401` `rest_forbidden` before the plugin runs.

  **Error format**
  API key errors are `WP_Error` responses (`code: simple_jwt_login_api_key_error`).
  When the API middleware or API keys are enabled they are rewritten into the plugin
  envelope (`{"success": false, "data": {"message", "error_code"}}`); see `ApiKeyError`.
operationId: listApiKeys
security:
  - WordPressSession: []
  - BearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number (1-based). Values below 1 are treated as 1.
    schema:
      type: integer
      minimum: 1
      default: 1
    example: 1
  - name: per_page
    in: query
    description: Number of results per page. Clamped to 1-100.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    example: 20
responses:
  '200':
    description: Paginated list of API keys.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: ../schemas/api-key-item.yaml
                total:
                  type: integer
                  description: Total number of matching keys.
                  example: 1
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 20
        example:
          success: true
          data:
            items:
              - id: 7
                name: My integration key
                key_prefix: sjl_a1b2****
                permissions:
                  - read
                  - create
                expires_at: null
                last_used_at: '2026-11-15 20:11:38'
                created_at: '2026-11-15 20:11:37'
                revoked_at: null
                user_id: 1
            total: 1
            page: 1
            per_page: 20
  '401':
    $ref: ../../responses/rest-forbidden.yaml
  '403':
    description: The user is not logged in (`error_code` 84).
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-error.yaml
        example:
          code: simple_jwt_login_api_key_error
          message: You must be logged in to manage API keys.
          data:
            status: 403
            error_code: 84
