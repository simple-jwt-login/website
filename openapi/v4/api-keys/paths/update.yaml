tags:
  - api_keys
  - internal
summary: Update an API key
description: |
  Replaces the `name`, `permissions` and `expires_at` of an existing API key. All three
  are written on every call: `name` and `permissions` are required, and omitting
  `expires_at` removes the expiry. Regular users may only update their own keys and
  only grant permissions they have (see `POST /api-keys`). Administrators may update
  any key.
operationId: updateApiKey
security:
  - WordPressSession: []
  - BearerAuth: []
parameters:
  - $ref: ../parameters/api-key-id.yaml
requestBody:
  description: Updated API key fields.
  required: true
  content:
    application/json:
      schema:
        $ref: ../schemas/update-api-key-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/update-api-key-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/update-api-key-body.yaml
responses:
  '200':
    description: API key updated successfully.
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-action-response.yaml
        example:
          success: true
          message: API key updated successfully.
  '401':
    $ref: ../../responses/rest-forbidden.yaml
  '403':
    $ref: ../responses/forbidden.yaml
  '404':
    $ref: ../responses/not-found.yaml
  '422':
    $ref: ../responses/invalid-input.yaml
  '500':
    description: |
      The update failed, including an administrator updating a key id that does not
      exist (`error_code` 90).
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-error.yaml
        examples:
          updateFailed:
            value:
              code: simple_jwt_login_api_key_error
              message: Failed to update API key.
              data:
                status: 500
                error_code: 90
