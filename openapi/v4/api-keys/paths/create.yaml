tags:
  - api_keys
  - internal
summary: Create an API key
description: |
  Generates a new API key for the authenticated WordPress user. The full key value
  (`sjl_` prefix + 32 hex characters) is returned **only in this response** - it
  cannot be retrieved again. Store it securely immediately.

  **Permissions**
  One or more of: `read`, `create`, `update`, `delete`. These map to the HTTP methods
  the key may be used to authenticate: GET, POST, PUT/PATCH, and DELETE respectively.
  Non-administrators can only grant permissions they have themselves:
  `read` needs `read`, `create` / `update` need `edit_posts`, `delete` needs `delete_posts`.

  **Requirements**
  - The user must be authenticated (see `GET /api-keys`).
  - `name` is required and must be non-empty.
  - At least one valid permission must be specified.
operationId: createApiKey
security:
  - WordPressSession: []
  - BearerAuth: []
requestBody:
  description: API key definition.
  required: true
  content:
    application/json:
      schema:
        $ref: ../schemas/create-api-key-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/create-api-key-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/create-api-key-body.yaml
responses:
  '200':
    description: |
      API key created. The `key` field contains the full plaintext key - save it now
      as it isn't returned again.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              properties:
                id:
                  type: integer
                  description: Database ID of the newly created key.
                  example: 7
                key:
                  type: string
                  description: Full plaintext API key. Store securely - shown only once.
                  example: sjl_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                name:
                  type: string
                  example: My integration key
                key_prefix:
                  type: string
                  description: 'First 8 characters of the key, for identification.'
                  example: sjl_a1b2
                permissions:
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - create
                      - update
                      - delete
                  example:
                    - read
                    - create
                expires_at:
                  type: string
                  nullable: true
                  description: 'Expiry in UTC `Y-m-d H:i:s`, or null for no expiry.'
                  example: '2027-01-01 00:00:00'
  '401':
    $ref: ../../responses/rest-forbidden.yaml
  '403':
    $ref: ../responses/forbidden.yaml
  '422':
    $ref: ../responses/invalid-input.yaml
  '500':
    description: |
      The database insert failed (`error_code` 88).
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-error.yaml
        example:
          code: simple_jwt_login_api_key_error
          message: Failed to create API key.
          data:
            status: 500
            error_code: 88
