tags:
  - api_keys
  - internal
summary: Revoke an API key
description: |
  Soft-deletes (revokes) an API key by recording a `revoked_at` timestamp. The key
  record is retained in the database but is rejected by the authentication middleware.
  To permanently remove the record, use `DELETE /api-keys/{id}`.

  Regular users may only revoke their own keys. Administrators may revoke any key.
operationId: revokeApiKey
security:
  - WordPressSession: []
  - BearerAuth: []
parameters:
  - $ref: ../parameters/api-key-id.yaml
responses:
  '200':
    description: API key revoked successfully.
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-action-response.yaml
        example:
          success: true
          message: API key revoked successfully.
  '401':
    $ref: ../../responses/rest-forbidden.yaml
  '403':
    $ref: ../responses/forbidden.yaml
  '404':
    $ref: ../responses/not-found.yaml
  '500':
    description: |
      The revoke failed, including an administrator revoking a key id that does not
      exist (`error_code` 91).
    content:
      application/json:
        schema:
          $ref: ../schemas/api-key-error.yaml
        example:
          code: simple_jwt_login_api_key_error
          message: Failed to revoke API key.
          data:
            status: 500
            error_code: 91
