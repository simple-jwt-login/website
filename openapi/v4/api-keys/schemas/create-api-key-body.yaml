type: object
required:
  - name
  - permissions
properties:
  name:
    type: string
    description: Human-readable name to identify the key.
    example: My integration key
  permissions:
    description: |
      Array (or comma-separated string) of permissions to grant.
      Valid values: `read`, `create`, `update`, `delete`.
    oneOf:
      - type: array
        items:
          type: string
          enum:
            - read
            - create
            - update
            - delete
      - type: string
    example:
      - read
      - create
  expires_at:
    type: string
    nullable: true
    description: |
      Optional expiry date/time, in UTC. Accepted forms: `Y-m-d`, `Y-m-d H:i[:s]` or
      ISO 8601 with an optional zone (`2027-01-01T00:00:00Z`, `+02:00`). A value without
      a zone is read as UTC; it is stored as UTC `Y-m-d H:i:s`. Any other value is
      rejected with `422` (`error_code` 132). Omit (or pass `null`) for a non-expiring key.
    example: '2027-01-01 00:00:00'
