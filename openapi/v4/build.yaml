info:
  title: Simple-JWT-Login
  description: |
    This is the Simple-JWT-Login WordPress plugin API Documentation.

    ## Introduction

    This API is documented in **OpenAPI format**. You can either open it in [swagger editor](https://editor.swagger.io/) or you can view it on this website.

    Also, you open it in postman, and you will be able to do local tests.

    ## Server

    You can access the Simple-JWT-Login API in two modes:
      - using permalink: https://{domain}/wp-json/simple-jwt-login/v1/{endpoint}
      - using rest_route: https://{domain}/?rest_route=/simple-jwt-login/v1/{endpoint}

    ## Authentication

    Most endpoints accept a JWT via the `JWT` query parameter, request body field, or `Authorization: Bearer <token>` header.

    API key management endpoints (`/api-keys`) accept authentication in one of two ways:
    - An active WordPress session (cookie-based auth), **or**
    - A valid JWT via `Authorization: Bearer <token>` header, the configured JWT header/cookie, or the `JWT` query parameter.

    ## Cross-Origin Resource Sharing
    This API features Cross-Origin Resource Sharing (CORS) implemented in compliance with  [W3C spec](https://www.w3.org/TR/cors/).
    And that allows cross-domain communication from the browser.
    All responses have a wildcard same-origin which makes them completely public and accessible to everyone, including any code on any site.

    ## Error Response Format

    All error responses share a common envelope:
    ```json
    {
      "success": false,
      "data": {
        "message": "Human-readable error description",
        "errorCode": 42
      }
    }
    ```
    The `errorCode` field maps to a specific internal error constant that can be used for programmatic error handling.
