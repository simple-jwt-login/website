tags:
  - oauth
summary: Exchange OAuth token for a WordPress JWT (POST)
description: |
  API flow: exchanges a provider-issued token for a WordPress JWT and returns the
  WordPress user profile. Use this variant for programmatic API clients. The provider
  must be enabled in the plugin settings.

  Supported providers: `google`, `auth0`, `facebook`, `github`.

  **Google** - supply `code` (authorization code) or `id_token` (Google Sign-In ID
  token). The `id_token` path returns a WordPress JWT directly; the `code` path
  returns the raw Google token response for the client to handle. The `id_token` must
  be issued for the configured client ID (unless "Allow tokens issued for other Google
  clients" is enabled in the Google settings) and carry a verified email.

  **Auth0** - supply `code` (returns the raw Auth0 token response) or `access_token`
  (returns a WordPress JWT). The `access_token` must be a JWT issued for the configured
  Auth0 Client ID (`azp` or `aud`). Opaque access tokens are rejected (error code 79)
  unless "Allow opaque access tokens" is enabled in the Auth0 settings.
  The account email must be verified.

  The `code` flow sends the provider the "exchange code" Redirect URI saved in the
  provider settings, so the code must have been issued for that URI.

  **Facebook** - supply `access_token` (Facebook user access token). Returns a
  WordPress JWT. The token must have been issued for the configured Facebook app
  (checked with `debug_token`), and the App ID and App Secret must be set, unless
  "Allow tokens issued for other Facebook apps" is enabled in the Facebook settings.

  **GitHub** - supply `access_token` (GitHub user access token). Returns a
  WordPress JWT. The token must have been issued for the configured GitHub OAuth
  app (personal access tokens are rejected), and the Client ID and Client Secret
  must be set, unless "Allow tokens issued for other GitHub apps" is enabled in the
  GitHub settings.

  If the OAuth identity matches an existing WordPress user (by email), a WordPress
  JWT is returned. If no match is found and "Register on OAuth login" is enabled, a
  new user is created automatically.
operationId: oauthTokenPost
requestBody:
  description: 'OAuth provider and authorization code, ID token, or access token.'
  content:
    application/json:
      schema:
        $ref: ../schemas/oauth-body.yaml
    multipart/form-data:
      schema:
        $ref: ../schemas/oauth-body.yaml
    application/x-www-form-urlencoded:
      schema:
        $ref: ../schemas/oauth-body.yaml
  required: true
responses:
  '200':
    description: |
      One of:
      - `id_token` / `access_token` flow: a WordPress JWT, or a 2FA challenge
        (`two_factor_required: true`, finish with `POST /auth/2fa`) when the user has
        Two-Factor enabled and the 2FA integration is on.
      - `code` flow: the raw token response of the provider, unchanged.
    content:
      application/json:
        schema:
          $ref: ../schemas/oauth-response.yaml
        examples:
          jwt:
            summary: id_token / access_token flow
            value:
              success: true
              data:
                jwt: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjMyOTk0MDAsImVtYWlsIjoiam9obkBkb2UuY29tIn0.signature
          twoFactorChallenge:
            summary: User has Two-Factor enabled
            value:
              success: true
              data:
                jwt: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0ZmFfcGVuZGluZyI6MX0.signature
                two_factor_required: true
                provider: Two_Factor_Totp
          code:
            summary: code flow (Google example)
            value:
              success: true
              data:
                access_token: ya29.a0Af...
                expires_in: 3599
                scope: 'openid https://www.googleapis.com/auth/userinfo.email'
                token_type: Bearer
                id_token: eyJhbGciOiJSUzI1NiIs...
  '400':
    description: 'The WordPress JWT could not be signed (JWT library error, for example, `error_code` 16).'
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: OpenSSL unable to sign data
            error_code: 16
  '401':
    description: |
      Unauthorized. One of:
      - The authorization code was rejected by the provider (`error_code` 72 Google,
        78 Auth0, 98 Facebook, 102 GitHub). The provider error is appended to the message.
      - The `id_token` / `access_token` is invalid, expired, or issued by another
        issuer or for another application (`error_code` 73 Google, 79 Auth0,
        99 Facebook, 103 GitHub).
      - The Google `id_token` was issued for another client ID (`error_code` 118).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        examples:
          invalidIdToken:
            value:
              success: false
              data:
                message: The provided id_token is invalid
                error_code: 73
          invalidGithubToken:
            value:
              success: false
              data:
                message: The provided GitHub access_token is invalid.
                error_code: 103
          wrongAudience:
            value:
              success: false
              data:
                message: The provided id_token was not issued for this website.
                error_code: 118
          invalidCode:
            value:
              success: false
              data:
                message: The code you provided is invalid.Bad Request. Invalid_grant
                error_code: 72
  '403':
    description: |
      Forbidden. One of:
      - The requested OAuth provider is not enabled in the plugin settings (`error_code` 70).
      - The account email is not verified, for Auth0 (`error_code` 111), GitHub (`error_code` 112),
        Google `id_token` (`error_code` 119).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        examples:
          providerDisabled:
            value:
              success: false
              data:
                message: This Oauth provider is not available.
                error_code: 70
          emailNotVerified:
            value:
              success: false
              data:
                message: The email address of this Google account is not verified.
                error_code: 119
  '404':
    description: |
      The identity email matches no WordPress user and "Register on OAuth login" is off
      (`error_code` 74 Google, 80 Auth0, 100 Facebook, 104 GitHub).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Wrong user credentials.
            error_code: 74
  '422':
    description: |
      Unprocessable entity. One of:
      - `provider` is missing or unknown (`error_code` 69).
      - Neither `code` nor the token parameter was sent (`error_code` 71 Google, 77 Auth0,
        97 Facebook, 101 GitHub).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        examples:
          invalidProvider:
            value:
              success: false
              data:
                message: The Oauth provider is invalid.
                error_code: 69
          missingParam:
            value:
              success: false
              data:
                message: The code or access_token parameter is missing from request.
                error_code: 97
  '500':
    description: |
      Internal server error. One of:
      - The 2FA nonce could not be created (`error_code` 133).
      - The new user could not be created (`error_code` 52).
    content:
      application/json:
        schema:
          $ref: ../../schemas/error.yaml
        example:
          success: false
          data:
            message: Unable to create two-factor nonce.
            error_code: 133
