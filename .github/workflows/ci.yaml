name: CI-validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🧑‍💻 Setup
        run: |
          yarn install

      - name: 📚 Spellcheck 
        run: yarn spellcheck

      # Also generates the API reference (prebuild)
      - name: 🔧 Check Build
        run: yarn build
