name: CI-preview

# Manual: only people with write access to the repository can start it.
# Does nothing unless the PREVIEWS_ENABLED repository variable is "true" (see README.md).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ inputs.pr }}
  cancel-in-progress: false

env:
  PR: ${{ inputs.pr }}

jobs:
  # Runs the code of the pull request, so it must never get secrets or write permissions.
  build:
    if: vars.PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🔢 Validate input
        run: '[[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number"; exit 1; }'

      - name: 🛎️ Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      # Not `yarn build`: its postbuild redirect pages would send /docs/ to production.
      # Cloudflare handles trailing slashes itself.
      - name: 🔧 Build
        env:
          REACT_APP_DOMAIN: "https://simplejwtlogin.com"
          REACT_APP_BASE_URL: "/"
          REACT_APP_CDN_URL: ""
          REACT_APP_GA_MEASUREMENT_ID: ""
        run: |
          yarn gen-api
          yarn docusaurus build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 1

  # Has the Cloudflare token: uses only trusted files plus the built static files.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 🚦 Check that the pull request is open
        run: '[[ "$(gh pr view "$PR" --json state --jq .state)" == "OPEN" ]] || { echo "::error::Pull request is not open"; exit 1; }'

      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: 🚀 Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          # Keep previews out of search engines
          printf '/*\n  X-Robots-Tag: noindex\n' > build/_headers
          npx --yes wrangler@4.168.0 deploy --name "simple-jwt-login-website-pr-$PR"

      - name: 💬 Comment the preview URL
        run: |
          url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$RUNNER_TEMP/wrangler.ndjson")"
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "🔍 Preview: $url - removed when the pull request is closed, or 2 days after the last deploy."
