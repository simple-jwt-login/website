name: CI-preview-cleanup

# pull_request_target gives access to the Cloudflare token for forks too.
# Safe only because nothing from the pull request is checked out or run. Keep it so.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

# A closed pull request waits for its running preview deploy, then deletes it.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || 'expired' }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4/accounts/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts
      PREFIX: simple-jwt-login-website-pr-
      PR: ${{ github.event.pull_request.number }}
      MAX_AGE_HOURS: 48
    steps:
      - name: 🧹 Delete the closed pull request's preview, or expired previews
        run: |
          set -euo pipefail
          workers="$(curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          # modified_on has fractional seconds, which fromdateiso8601 rejects
          jq -r --arg prefix "$PREFIX" --arg pr "$PR" --argjson hours "$MAX_AGE_HOURS" '
            .result[]
            | select(.id | test("^" + $prefix + "[0-9]+$"))
            | select(
                if $pr != "" then .id == $prefix + $pr
                else (.modified_on | sub("\\.[0-9]+"; "") | fromdateiso8601) < now - $hours * 3600
                end)
            | .id' <<< "$workers" > names.txt
          while IFS= read -r name; do
            echo "Deleting $name"
            curl -fsS --retry 3 -o /dev/null -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$name?force=true"
          done < names.txt
